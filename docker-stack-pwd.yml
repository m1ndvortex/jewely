# Docker Stack for Play with Docker Testing
# Simplified version without persistent volumes and external dependencies
version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jewelry_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --maxmemory 64mb
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M

  web:
    image: ${DOCKER_REGISTRY:-ghcr.io/m1ndvortex}/jewelry-shop:${VERSION:-latest}
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.base
      - DEBUG=False
      - SECRET_KEY=play-with-docker-test-key-not-secure
      - DATABASE_URL=postgres://postgres:postgres123@db:5432/jewelry_shop
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    networks:
      - frontend
      - backend
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  celery_worker:
    image: ${DOCKER_REGISTRY:-ghcr.io/m1ndvortex}/jewelry-shop:${VERSION:-latest}
    command: celery -A config worker --loglevel=info -Q celery,backups --concurrency=2
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.base
      - DATABASE_URL=postgres://postgres:postgres123@db:5432/jewelry_shop
      - REDIS_URL=redis://redis:6379/0
    networks:
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  celery_beat:
    image: ${DOCKER_REGISTRY:-ghcr.io/m1ndvortex}/jewelry-shop:${VERSION:-latest}
    command: celery -A config beat --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.base
      - DATABASE_URL=postgres://postgres:postgres123@db:5432/jewelry_shop
      - REDIS_URL=redis://redis:6379/0
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - frontend
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 32M

configs:
  nginx_config:
    file: ./docker/nginx/nginx-pwd.conf

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
    internal: true
